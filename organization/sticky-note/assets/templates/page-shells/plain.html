<!doctype html><html><head><meta charset="utf-8"><title>{{TITLE}}</title>
<style>
@page{size:Letter;margin:0.6in 0.6in 0.7in}
body{font-family:"Helvetica Neue",Arial,sans-serif;color:#2f3640;font-size:11pt;line-height:1.5;background:#fff}
.stamp{display:flex;justify-content:space-between;align-items:center;background:#fff6d6;border-left:8px solid #f5c542;border-radius:10px;padding:14px 20px;margin-bottom:18px}
.stamp h1{margin:0;font-size:22pt;color:#5a4a12}
.stamp .date{font-size:10pt;color:#7a6a32;text-align:right}
h2{font-size:15pt;color:#33566e;background:#e8f1f8;border-radius:8px;padding:6px 12px;margin:22px 0 8px;page-break-after:avoid}
h3{font-size:12.5pt;color:#4b6b4f;border-bottom:2px solid #dcebd9;padding-bottom:2px;margin:16px 0 6px;page-break-after:avoid}
h4{font-size:11pt;color:#7a5a8a;margin:10px 0 4px}
section.top{background:#fdeef0;border:2px solid #f2b8c0;border-radius:12px;padding:4px 16px 10px;margin:12px 0}
section.top h2{background:none;padding:6px 0;color:#9a3448}
section.ten{background:#eaf7ef;border:2px solid #b5dfc3;border-radius:12px;padding:4px 16px 10px;margin:12px 0}
section.ten h2{background:none;padding:6px 0;color:#2f7a4a}
li{margin:4px 0}ol,ul{padding-left:22px}
a{color:#2a6fb0;text-decoration:none}
strong{color:#1f2a33}
.foot{margin-top:24px;font-size:9pt;color:#8a8f96;text-align:center;border-top:1px solid #eee;padding-top:8px}
</style></head><body>
<div class="stamp"><h1>{{TITLE}}</h1><div class="date">{{UPDATED}}<br>PDF made {{MADE}}</div></div>
{{BODY}}
<div class="foot">Reply KEEP to approve as is · EDIT with changes · HOLD to park · CUT to drop</div>
</body></html>
